name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release'
        type: boolean
        default: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Python is required by node-gyp to compile native modules from source
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Windows: make sure MSVC build tools are on PATH for node-gyp
      - name: Setup MSVC (Windows)
        if: matrix.platform == 'win'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci
        env:
          # Prevent postinstall electron-rebuild from running during npm ci
          # We'll rebuild explicitly in the next step with the right config
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Download Electron binary
        run: npx electron --version
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 0

      - name: Rebuild native modules
        run: npm run rebuild-native
        env:
          npm_config_msvs_version: '2022'

      - name: Build & Package (macOS)
        if: matrix.platform == 'mac'
        env:
          APPLE_ID:           ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD:  ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID:      ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK:           ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD:   ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          GH_TOKEN:           ${{ secrets.GH_TOKEN }}
        run: npm run release

      - name: Build & Package (Windows)
        if: matrix.platform == 'win'
        env:
          GH_TOKEN:             ${{ secrets.GH_TOKEN }}
        run: npm run release

      - name: Build & Package (Linux)
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            out/*.dmg
            out/*.exe
            out/*.AppImage
            out/*.deb
            out/*.zip
          if-no-files-found: ignore
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
